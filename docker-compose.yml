version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholarease-backend
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=sqlite:///./scholarease.db
      - PORT=8002
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scholarease-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped
